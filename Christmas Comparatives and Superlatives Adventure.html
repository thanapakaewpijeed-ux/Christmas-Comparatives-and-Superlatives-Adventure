/* ---------- SCREENS ---------- */
function welcome(){
 app.innerHTML=`<div class="big">🎅</div><h1 class="center">WELCOME TO CHRISTMAS ADVENTURE!</h1><p class="center">Help Santa prepare the best Christmas celebration ever!</p><input class="ti" id="sn" maxlength="40" placeholder="Student Name" autocomplete="off" aria-label="Student Name"><input class="ti" id="sk" list="cl" maxlength="10" placeholder="Class / Room (for example M.3/1)" autocomplete="off" aria-label="Class or Room"><datalist id="cl"><option value="M.3/1"><option value="M.3/2"><option value="M.3/3"></datalist><input class="ti" id="sb" inputmode="numeric" maxlength="2" placeholder="Student Number" autocomplete="off" aria-label="Student Number"><p class="er" id="er" role="alert"></p><div class="row"><button class="btn" id="go0">START ADVENTURE</button><button class="btn alt" id="td" hidden>TEACHER DASHBOARD</button></div>`;
 $("#td").hidden=!(isT&&DB);$("#td").onclick=dash;
 $("#go0").onclick=()=>{const w=$("#sn").value.trim(),c=$("#sk").value.trim().toUpperCase(),n=$("#sb").value.trim();
  if(!w||!c||!n){$("#er").textContent="Please fill in all 3 boxes.";return}
  if(!/^\d{1,2}$/.test(n)||+n<1){$("#er").textContent="Student Number must be a number from 1 to 99.";return}
  $("#go0").disabled=true;ac();S={who:w,cls:c,no:String(+n),sc:[null,null,null,null],res:[null,null,null,null],at:null};try{LS.setItem("cx",JSON.stringify(S))}catch(e){}sfx.tap();amb();rules()}}
function rules(){
 app.innerHTML=`<div class="big">📜</div><h1 class="center">HOW TO PLAY</h1><ol style="line-height:1.55;padding-left:22px"><li>Complete all 4 Christmas missions.</li><li>Each mission contains 15 questions.</li><li>There are 60 questions in total.</li><li>Choose the correct answer before time runs out.</li><li>Multiple-choice questions have 10 seconds.</li><li>Matching, sentence-building and choose-the-sentence questions have 15 seconds.</li><li>Earn 1 point for each correct answer.</li><li>Incorrect or unanswered questions receive 0 points.</li><li>Complete each mission to unlock the next one.</li><li>Try your best and become a Christmas Grammar Master!</li></ol><div class="row"><button class="btn" id="st">START GAME</button><button class="btn alt" id="bk">BACK</button></div>`;
 $("#st").onclick=()=>{ac();amb();sfx.tap();menu()};$("#bk").onclick=welcome}
function menu(){
 stopT();const tot=S.sc.reduce((a,b)=>a+(b||0),0),all=S.sc.every(v=>v!=null);
 app.innerHTML=`<div class="top"><span>🎅 ${esc(S.who)} · ${esc(S.cls)} · No. ${esc(S.no)}</span><span>⭐ ${tot}/60</span></div><h1>Choose your mission</h1>`+NAMES.map((n,i)=>{const dn=S.sc[i]!=null,un=i===0||S.sc[i-1]!=null;return `<button class="lv" data-i="${i}" ${un&&!dn?"":"disabled"}><span class="ic">${un?ICO[i]:"🔒"}</span><span><b>Stage ${i+1}: ${n}</b><small>${SUB[i]}<br>(${types(i)})</small></span><span class="st">${dn?S.sc[i]+"/15 ✅":un?"15 questions":""}</span></button>`}).join("")+`<div class="row">${all?'<button class="btn" id="fr">VIEW FINAL RESULT</button>':""}<button class="btn alt" id="chg">Change student</button></div>`;
 app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{sfx.tap();play(+b.dataset.i)});
 if(all)$("#fr").onclick=final;
 $("#chg").onclick=()=>{if(confirm("Start again as a different student?")){try{LS.removeItem("cx")}catch(e){}S=null;welcome()}}}
function play(i){cur=i;qi=0;R={c:0,w:0,t:0};QS=STAGES[i].slice();show()}
function show(){
 const q=QS[qi],k=q.k;busy=0;clearTimeout(nt);TL=("xub".includes(k)||/sentence/i.test(q.q))?15:10;
 let h=`<div class="top"><span>${ICO[cur]} ${NAMES[cur]}</span><span>Q ${qi+1}/15 · ⭐ ${R.c}</span></div><div class="bar"><i style="width:${qi/15*100}%"></i></div><div class="tm"><i id="tb"></i><b id="tn">${TL}</b></div>${q.p?`<div class="pic">${q.p}</div>`:""}<div class="q">${q.q}</div>`;
 if(k==="x")h+=`<div class="mt"><div id="ml"></div><div id="mr"></div></div>`;
 else if(k==="f")h+=`<input class="ti" id="ti" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Your answer"><div class="row"><button class="btn" id="chk">Check answer</button></div>`;
 else if(k==="u"||k==="b")h+=`<div class="chips ans" id="ans" aria-label="Your sentence"></div><div class="chips" id="pool"></div><div class="row"><button class="btn" id="chk">Check answer</button></div>`;
 else{q.ix=q.fx?[0,1]:shuf(q.o.map((_,i)=>i));h+=q.ix.map(i=>`<button class="opt" data-i="${i}">${q.o[i]}</button>`).join("")}
 h+=`<div id="fb" aria-live="polite"></div>`;app.innerHTML=h;startT();
 if(k==="x"){mm=[];mi=0;sl=null;mo=shuf(q.m.map((_,i)=>i));drawM()}
 else if(k==="f"){const ti=$("#ti");ti.focus();const ck=()=>{const v=ti.value.trim().toLowerCase().replace(/\s+/g," ");if(v)done(q.a.split("|").indexOf(v)>=0)};$("#chk").onclick=ck;ti.onkeydown=e=>{if(e.key==="Enter")ck()}}
 else if(k==="u"||k==="b"){chosen=[];pool=shuf(q.s.replace(/[.?]$/,"").split(" ").concat(q.d||[]));drawU();$("#chk").onclick=()=>done(chosen.map(i=>pool[i]).join(" ")===q.s.replace(/[.?]$/,""))}
 else app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(busy)return;const ok=+b.dataset.i===0;app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===0)o.classList.add("ok")});if(!ok)b.classList.add("bad");done(ok)})}
function drawU(){
 $("#ans").innerHTML=chosen.map(i=>`<button class="chip" data-r="${i}">${pool[i]}</button>`).join("");
 $("#pool").innerHTML=pool.map((w,i)=>chosen.indexOf(i)>=0?"":`<button class="chip" data-a="${i}">${w}</button>`).join("");
 app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(busy)return;chosen.push(+b.dataset.a);sfx.tap();drawU()});
 app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(busy)return;chosen=chosen.filter(x=>x!==+b.dataset.r);drawU()})}
function drawM(){
 const q=QS[qi];
 $("#ml").innerHTML=q.m.map((p,i)=>`<button class="chip ${mm.indexOf(i)>=0?"ok":sl===i?"sel":""}" data-l="${i}" ${mm.indexOf(i)>=0?"disabled":""}>${p[0]}</button>`).join("");
 $("#mr").innerHTML=mo.map(i=>`<button class="chip ${mm.indexOf(i)>=0?"ok":""}" data-r="${i}" ${mm.indexOf(i)>=0?"disabled":""}>${q.m[i][1]}</button>`).join("");
 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{if(busy)return;sl=+b.dataset.l;sfx.tap();drawM()});
 app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(busy||sl===null)return;if(sl===+b.dataset.r){mm.push(sl);sl=null;sfx.tap();drawM();if(mm.length===q.m.length)done(mi===0)}else{mi++;sl=null;tone(300,0,.2,"sine",.1);drawM()}})}
function done(ok,late){
 if(busy)return;busy=1;stopT();const q=QS[qi];if(ok)R.c++;else if(late)R.t++;else R.w++;
 app.querySelectorAll(".chip,.opt,.ti,#chk").forEach(b=>b.disabled=true);
 if(late&&q.o)app.querySelectorAll(".opt").forEach(o=>{if(+o.dataset.i===0)o.classList.add("ok")});
 if(ok){sfx.ok();burst("⭐")}else sfx.bad();
 const ans=q.o?q.o[0]:q.k==="f"?q.a.split("|")[0]:q.k==="x"?"":q.s;
 $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?pick(OKS)+" +1 point ⭐":late?"⏰ Time’s up! Keep trying!":pick(BADS)}</b>${ok||!ans?"":`<br>Correct answer: <b>${ans}</b>`}<br>${q.e}<button class="btn" id="nx">${qi<14?"Next question":"See results"}</button></div>`;
 const nx=()=>{clearTimeout(nt);qi++;qi<15?show():result()};$("#nx").onclick=nx;if(late)nt=setTimeout(nx,3500)}
function result(){
 stopT();const last=cur===3;
 if(S.sc[cur]==null){S.sc[cur]=R.c;S.res[cur]=[R.c,R.w,R.t];if(last)S.at=Date.now()}
 const pct=Math.round(R.c/15*100),acc=R.c+R.w?Math.round(R.c/(R.c+R.w)*100):0;
 app.innerHTML=`<div class="big">${last?"🏆":"🎁"}</div><h2 class="center">MISSION COMPLETED!</h2><p class="center">${NAMES[cur]}</p><p class="center">Great work! You earned ${R.c} out of 15 points!</p><div class="sum"><div><span>Correct Answers</span><b>${R.c}</b></div><div><span>Incorrect Answers</span><b>${R.w}</b></div><div><span>Time Out</span><b>${R.t}</b></div><div><span>Score Earned</span><b>${R.c}/15</b></div><div><span>Percentage</span><b>${pct}%</b></div><div><span>Accuracy</span><b>${acc}%</b></div></div><p class="center" id="sv">Saving…</p><div class="row"><button class="btn" id="go">${last?"SEE FINAL RESULT":"CONTINUE TO NEXT MISSION"}</button></div>`;
 sfx[last?"fin":"win"]();burst("🎁");push();
 $("#go").onclick=()=>{if(last)final();else{sfx.unlock();play(cur+1)}}}
function final(){
 const tot=S.sc.reduce((a,b)=>a+(b||0),0),sm=j=>S.res.reduce((a,r)=>a+(r?r[j]:0),0);
 app.innerHTML=`<div class="big">🎅🧝🎁</div><h1 class="center">CONGRATULATIONS!</h1><h2 class="center">YOU ARE A CHRISTMAS GRAMMAR MASTER! 🏅</h2><div class="sum"><div><span>Student Name</span><b>${esc(S.who)}</b></div><div><span>Class / Room</span><b>${esc(S.cls)}</b></div><div><span>Student Number</span><b>${esc(S.no)}</b></div><div><span>Total Score</span><b>${tot} / 60</b></div><div><span>Percentage</span><b>${Math.round(tot/60*100)}%</b></div><div><span>Correct / Incorrect / Time Out</span><b>${sm(0)} / ${sm(1)} / ${sm(2)}</b></div><div><span>Completion Status</span><b>Completed</b></div></div><div class="sum">${NAMES.map((n,i)=>`<div><span>${i+1}. ${n}<br><small>(${types(i)})</small></span><b>${S.sc[i]}/15</b></div>`).join("")}<div><span><b>TOTAL SCORE</b><br><small>60 Questions</small></span><b>${tot}/60</b></div></div><p class="center" id="sv">${esc(PS)}</p><div class="row"><button class="btn alt" id="mp">Back to map</button></div>`;
 sfx.fin();burst("🎆");setTimeout(()=>burst("🎁"),500);$("#mp").onclick=menu}
/* ---------- SAVE ---------- */
async function push(){
 try{LS.setItem("cx",JSON.stringify(S))}catch(e){}
 let m="⚠️ Score saved on this device only.";
 if(DB&&USR){try{let h=0;for(const ch of (S.cls+"|"+S.no+"|"+S.who).toLowerCase())h=(h*31+ch.charCodeAt(0))|0;
  const key="s"+(h>>>0).toString(36),ref=DB.doc("scores/"+await USR.id()),sn=await ref.get(),old=(sn.exists&&sn.data().students)||{},e=old[key]||{sc:[null,null,null,null],res:[null,null,null,null]};
  const sc=e.sc.map((v,i)=>v!=null?v:S.sc[i]),res=e.res.map((v,i)=>v||S.res[i]),fin=sc.every(v=>v!=null);
  old[key]={who:S.who,cls:S.cls,no:S.no,sc,res,fin,at:fin?(e.at||S.at||Date.now()):null,upd:Date.now()};await ref.set({students:old});m="✅ Your score was sent to your teacher."}catch(x){m="⚠️ Score could not be sent. Please tell your teacher."}}
 PS=m;const el=$("#sv");if(el)el.textContent=m}
/* ---------- TEACHER DASHBOARD ---------- */
function dash(){
 if(!DB)return;let rows=[],open={};
 app.innerHTML=`<div class="top"><span>📋 TEACHER DASHBOARD</span><button class="btn alt" id="bk">Back</button></div><div class="sum" id="ov"></div><div class="dash" id="mo"></div><div class="row"><input class="ti sm" id="fq" placeholder="Search name" aria-label="Search name"><select class="ti sm" id="fc" aria-label="Filter by class"></select><select class="ti sm" id="fs" aria-label="Sort"><option value="no">Sort: student number</option><option value="hi">Sort: highest score</option><option value="lo">Sort: lowest score</option></select></div><div class="dash" id="dt"></div><div class="row"><button class="btn alt" id="rf">REFRESH DATA</button><button class="btn" id="csv">EXPORT CSV</button><button class="btn alt" id="pr">PRINT SCORE REPORT</button></div>`;
 const tot=r=>r.sc.reduce((a,b)=>a+(b||0),0);
 const vis=()=>{const q=$("#fq").value.trim().toLowerCase(),c=$("#fc").value,s=$("#fs").value;let v=rows.filter(r=>(!q||r.who.toLowerCase().indexOf(q)>=0)&&(!c||r.cls===c));
  v.sort((a,b)=>s==="hi"?tot(b)-tot(a):s==="lo"?tot(a)-tot(b):a.cls.localeCompare(b.cls,undefined,{numeric:true})||a.no-b.no);return v};
 const draw=()=>{const fc=$("#fc"),cv=fc.value,cl=[...new Set(rows.map(r=>r.cls))].sort();fc.innerHTML='<option value="">All classes</option>'+cl.map(c=>`<option ${c===cv?"selected":""}>${esc(c)}</option>`).join("");
  const dn=rows.filter(r=>r.fin),ts=dn.map(tot);
  $("#ov").innerHTML=[["Total Students",rows.length],["Students Completed",dn.length],["Students In Progress",rows.length-dn.length],["Class Average",ts.length?(ts.reduce((a,b)=>a+b,0)/ts.length).toFixed(1)+"/60":"-"],["Highest Score",ts.length?Math.max(...ts):"-"],["Lowest Score",ts.length?Math.min(...ts):"-"],["Total Questions",60]].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
  const vv=vis(),dd=vv.filter(r=>r.fin),tt=dd.map(tot),sm=a=>a.reduce((x,y)=>x+y,0);$("#mo").innerHTML=`<table><tr><th>Mission</th><th>Students played</th><th>Average</th><th>Highest</th><th>Lowest</th><th>Average %</th></tr>`+NAMES.map((n,i)=>{const a=vv.map(r=>r.sc[i]).filter(x=>x!=null),av=a.length?sm(a)/a.length:0;return `<tr><td>${i+1}. ${n}<br><small>(${types(i)})</small></td><td>${a.length}</td><td>${a.length?av.toFixed(1)+"/15":"-"}</td><td>${a.length?Math.max(...a):"-"}</td><td>${a.length?Math.min(...a):"-"}</td><td>${a.length?(av/15*100).toFixed(1)+"%":"-"}</td></tr>`}).join("")+`<tr><td><b>ALL 4 MISSIONS</b><br><small>60 Questions</small></td><td>${dd.length} completed</td><td>${tt.length?(sm(tt)/tt.length).toFixed(1)+"/60":"-"}</td><td>${tt.length?Math.max(...tt):"-"}</td><td>${tt.length?Math.min(...tt):"-"}</td><td>${tt.length?(sm(tt)/tt.length/60*100).toFixed(1)+"%":"-"}</td></tr></table>`;
  const v=vis();$("#dt").innerHTML=`<table><tr><th>No.</th><th>Student Name</th><th>Class</th><th>Stage 1 /15</th><th>Stage 2 /15</th><th>Stage 3 /15</th><th>Stage 4 /15</th><th>Total /60</th><th>%</th><th>Status</th><th>Finished</th></tr>`+v.map(r=>`<tr data-k="${esc(r.k)}"><td>${esc(r.no)}</td><td>${esc(r.who)}</td><td>${esc(r.cls)}</td>${[0,1,2,3].map(i=>`<td>${r.sc[i]==null?"-":r.sc[i]}</td>`).join("")}<td><b>${tot(r)}</b></td><td>${(tot(r)/60*100).toFixed(1)}%</td><td>${r.fin?"Completed":"In Progress"}</td><td>${r.at?new Date(r.at).toLocaleString():"-"}</td></tr>${open[r.k]?`<tr><td colspan="11" style="text-align:left">${[0,1,2,3].map(i=>`Stage ${i+1}: ${r.res[i]?r.res[i][0]+" correct, "+r.res[i][1]+" incorrect, "+r.res[i][2]+" time out":"not played"}`).join(" · ")}</td></tr>`:""}`).join("")+`</table>`;
  app.querySelectorAll("tr[data-k]").forEach(t=>t.onclick=()=>{open[t.dataset.k]=!open[t.dataset.k];draw()})};
 const sub=()=>{if(unsub)unsub();unsub=DB.collection("scores").onSnapshot(s=>{rows=s.docs.reduce((a,d)=>a.concat(Object.entries(d.data().students||{}).map(([k,v])=>Object.assign({},v,{k:d.id+k}))),[]);draw()},()=>{$("#dt").textContent="Could not load scores."})};
 ["fq","fc","fs"].forEach(i=>$("#"+i).oninput=draw);$("#rf").onclick=sub;$("#pr").onclick=()=>{try{window.print()}catch(e){}};
 $("#bk").onclick=()=>{if(unsub)unsub();unsub=null;welcome()};
 $("#csv").onclick=async()=>{try{const dl=await claude.use("downloads"),q=v=>'"'+String(v).replace(/"/g,'""')+'"',v=vis();
  const t=["No,Name,Class,Stage 1,Stage 2,Stage 3,Stage 4,Total,Percentage,Status,Finished"].concat(v.map(r=>[r.no,q(r.who),q(r.cls)].concat(r.sc.map(x=>x==null?"":x),[tot(r),(tot(r)/60*100).toFixed(2)+"%",r.fin?"Completed":"In Progress",r.at?q(new Date(r.at).toLocaleString()):""]).join(","))).join("\n");
  await dl.save({filename:"christmas-grammar-scores.csv",data:"\ufeff"+t})}catch(e){}};
 sub()}
/* ---------- INIT ---------- */
for(let i=0;i<22;i++){const s=document.createElement("span");s.className="sn";s.textContent="❄";s.style.cssText="left:"+Math.random()*100+"vw;font-size:"+(10+Math.random()*16)+"px;animation-duration:"+(7+Math.random()*9)+"s;animation-delay:-"+Math.random()*12+"s";document.body.appendChild(s)}
$("#bm").onclick=()=>{ac();mus=!mus;$("#bm").style.opacity=mus?1:.4;if(mus)amb()};
$("#bs").onclick=()=>{ac();snd=!snd;$("#bs").textContent=snd?"🔊":"🔇"};
$("#bv").oninput=e=>{vol=e.target.value/100;if(MG)MG.gain.value=vol};
document.addEventListener("pointerdown",()=>{ac();if(!ambT)amb()},{once:true});
if(S&&S.who&&S.sc)menu();else welcome();
(async()=>{try{const u=await claude.use("user");USR=u;DB=await claude.use("db");isT=!!(u&&await u.canEdit());const b=$("#td");if(b)b.hidden=!(isT&&DB)}catch(e){}})();
</script>
</body>
</html>
